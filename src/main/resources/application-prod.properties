# Activated with SPRING_PROFILES_ACTIVE=prod (Render + Neon PostgreSQL)
# DATABASE_URL example: jdbc:postgresql://ep-xxxx.us-east-2.aws.neon.tech/canchaya?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

canchaya.seed=${SEED_DEMO_DATA:false}
canchaya.jwt.secret=${JWT_SECRET}

# Real e-mail (optional): set MAIL_ENABLED=true and the SMTP variables
canchaya.mail.enabled=${MAIL_ENABLED:false}
canchaya.mail.from=${MAIL_FROM:no-reply@canchaya.co}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
