spring.application.name=canchaya-backend
server.port=${PORT:8080}

# --- Database: in-memory H2 for local development (see application-prod.properties for Neon) ---
spring.datasource.url=jdbc:h2:mem:canchaya;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CanchaYa ---
canchaya.seed=true
canchaya.deposit-percentage=30
# Simulated NEQUI/DAVIPLATA payments always approve: dev and tests only (off in prod).
canchaya.payments.simulated-enabled=true
# Minutes an unpaid reservation keeps its slot before it expires.
canchaya.reservations.payment-timeout-minutes=15
# Reference fields (real businesses not on CanchaYa) can be booked as a demo. Set false once real owners join.
canchaya.reservations.reference-bookable=${REFERENCE_FIELDS_BOOKABLE:true}
canchaya.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
canchaya.jwt.expiration-hours=24
canchaya.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Wompi (sandbox by default: test keys, no real money). Keys come from the environment.
canchaya.wompi.public-key=${WOMPI_PUBLIC_KEY:}
canchaya.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
canchaya.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
canchaya.wompi.api-url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
canchaya.mail.enabled=false
