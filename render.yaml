# Render Blueprint: Spring Boot API (Docker) + Neon PostgreSQL (external)
services:
  - type: web
    name: canchaya-backend
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Frontend URL(s), comma separated
      - key: CORS_ALLOWED_ORIGINS
        value: https://canchaya-frontend.onrender.com,http://localhost:5173
      # Demo data comes from the database repo (seeds/), not from the backend
      - key: SEED_DEMO_DATA
        value: "false"
      # Wompi sandbox keys (comercios.wompi.co > Desarrolladores). Test keys: no real money.
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
